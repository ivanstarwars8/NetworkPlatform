# XcodeGen specification: app + Packet Tunnel extensions for iOS/iPadOS (one universal target), macOS,
# tvOS and visionOS, in the build flavours of ADR-0007 (XrayOnly, MihomoOnly, Dual).
#
#   Cores/BuildScripts/bridge-apple-xcframework.sh                          # NPXrayBridge.xcframework
#   NP_BRIDGE_ENGINE=mihomo Cores/BuildScripts/bridge-apple-xcframework.sh  # NPMihomoBridge.xcframework
#   cd Apps && xcodegen generate
#   Tools/apple-build-flavour.sh <platform> <flavour> [Debug|Release]       # build + product checks
#
# Verified state: see STATUS.md and .github/workflows/apple.yml (unsigned compile on the macOS CI runner).
# Nothing was signed, installed or run. The generated NetworkPlatform.xcodeproj is not stored in git.
#
# Before a signed build set, in Configurations/Local.xcconfig (git-ignored) or on the command line
# (Documentation/Apple/BUILD_ON_MAC.md):
#   NP_BUNDLE_ID_PREFIX  - a bundle identifier owned by the signing team (default: a placeholder)
#   DEVELOPMENT_TEAM     - the Apple Developer team identifier
# and register the App Group and the Network Extension capability for every identifier.
#
# Targets (one per platform, XcodeGen suffixes the name with _<platform>), ADR-0001 §3 and ADR-0009:
#   PacketTunnelXray_<p>    extension with the Xray bridge only (EngineXray + NPXrayBridge), no GPL code
#   PacketTunnelMihomo_<p>  extension with the Mihomo bridge only (EngineMihomo + NPMihomoBridge), GPL-3.0
#   AppXrayOnly_<p>         application embedding PacketTunnelXray
#   AppMihomoOnly_<p>       application embedding PacketTunnelMihomo
#   AppDual_<p>             application embedding both extensions
# The applications are one template; they differ only in the extensions they embed, which Xcode cannot
# choose per build configuration. None of them links Go (ADR-0001 rule 2).
#
# Build configurations = flavour x {Debug, Release} through Configurations/<flavour>.xcconfig. The flavour
# sets NP_FLAVOUR and the app's compilation conditions (which engines the build contains). Each extension
# compiles with its own engine's condition only (NP_ENGINE_CONDITIONS), also in Dual. The "Flavour guard"
# phases refuse a configuration that does not match the target: an app target of another flavour, or an
# extension whose engine the flavour does not contain.
#
# Schemes: NetworkPlatform-<flavour>-<platform>, e.g. NetworkPlatform-MihomoOnly-iOS.
#
# App Group (NP_APP_GROUP): all targets of a platform name the same group, in the entitlements and in
# the Info.plist key NPAppGroupIdentifier. iOS, tvOS, visionOS use group.<id>; macOS uses <TeamID>.<id>
# ($(TeamIdentifierPrefix) expands to "<TeamID>." only when signed with a team). [U] for a signed build.
#
# Signed iOS build for TestFlight ("Byk" identity): .github/workflows/testflight.yml overlays
# Configurations/Byk.xcconfig with `xcodebuild -xcconfig` on Release-XrayOnly; see Documentation/Apple/TESTFLIGHT.md.
#
# Not covered: the Developer ID system-extension variant of macOS (ADR-0005 §3).

name: NetworkPlatform

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"

configs:
  Debug-XrayOnly: debug
  Release-XrayOnly: release
  Debug-MihomoOnly: debug
  Release-MihomoOnly: release
  Debug-Dual: debug
  Release-Dual: release

configFiles:
  Debug-XrayOnly: Configurations/XrayOnly.xcconfig
  Release-XrayOnly: Configurations/XrayOnly.xcconfig
  Debug-MihomoOnly: Configurations/MihomoOnly.xcconfig
  Release-MihomoOnly: Configurations/MihomoOnly.xcconfig
  Debug-Dual: Configurations/Dual.xcconfig
  Release-Dual: Configurations/Dual.xcconfig

packages:
  NetworkPlatform:
    path: ..

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Reports data-race problems as warnings in Swift 5 mode.
    SWIFT_STRICT_CONCURRENCY: complete
    # Engine conditions: the flavour's for the app; each extension target overrides them with its own.
    NP_ENGINE_CONDITIONS: $(NP_FLAVOUR_CONDITIONS)
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(NP_ENGINE_CONDITIONS)"
    NP_APP_GROUP: group.$(NP_BUNDLE_ID_PREFIX)
    "NP_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)$(NP_BUNDLE_ID_PREFIX)
    "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(NP_ENGINE_CONDITIONS)"

schemes:
  NetworkPlatform-XrayOnly-iOS:
    build: { targets: { AppXrayOnly_iOS: all } }
    run: { config: Debug-XrayOnly }
    archive: { config: Release-XrayOnly }
  NetworkPlatform-XrayOnly-macOS:
    build: { targets: { AppXrayOnly_macOS: all } }
    run: { config: Debug-XrayOnly }
    archive: { config: Release-XrayOnly }
  NetworkPlatform-XrayOnly-tvOS:
    build: { targets: { AppXrayOnly_tvOS: all } }
    run: { config: Debug-XrayOnly }
    archive: { config: Release-XrayOnly }
  NetworkPlatform-XrayOnly-visionOS:
    build: { targets: { AppXrayOnly_visionOS: all } }
    run: { config: Debug-XrayOnly }
    archive: { config: Release-XrayOnly }
  NetworkPlatform-MihomoOnly-iOS:
    build: { targets: { AppMihomoOnly_iOS: all } }
    run: { config: Debug-MihomoOnly }
    archive: { config: Release-MihomoOnly }
  NetworkPlatform-MihomoOnly-macOS:
    build: { targets: { AppMihomoOnly_macOS: all } }
    run: { config: Debug-MihomoOnly }
    archive: { config: Release-MihomoOnly }
  NetworkPlatform-MihomoOnly-tvOS:
    build: { targets: { AppMihomoOnly_tvOS: all } }
    run: { config: Debug-MihomoOnly }
    archive: { config: Release-MihomoOnly }
  NetworkPlatform-MihomoOnly-visionOS:
    build: { targets: { AppMihomoOnly_visionOS: all } }
    run: { config: Debug-MihomoOnly }
    archive: { config: Release-MihomoOnly }
  NetworkPlatform-Dual-iOS:
    build: { targets: { AppDual_iOS: all } }
    run: { config: Debug-Dual }
    archive: { config: Release-Dual }
  NetworkPlatform-Dual-macOS:
    build: { targets: { AppDual_macOS: all } }
    run: { config: Debug-Dual }
    archive: { config: Release-Dual }
  NetworkPlatform-Dual-tvOS:
    build: { targets: { AppDual_tvOS: all } }
    run: { config: Debug-Dual }
    archive: { config: Release-Dual }
  NetworkPlatform-Dual-visionOS:
    build: { targets: { AppDual_visionOS: all } }
    run: { config: Debug-Dual }
    archive: { config: Release-Dual }

targetTemplates:
  App:
    type: application
    platform: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: SharedApp
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: ../Extensions/PacketTunnel/Shared
      # Per-platform branding assets (app icon: Branding/iOS, Branding/macOS; Tools/make-app-icon.py). Platforms
      # without a folder skip it.
      - path: Branding/${platform}
        optional: true
    preBuildScripts:
      - name: Flavour guard
        basedOnDependencyAnalysis: false
        script: |
          if [ "${NP_FLAVOUR:-}" != "${NP_APP_FLAVOUR}" ]; then
            echo "error: target ${TARGET_NAME} is the ${NP_APP_FLAVOUR} application; build it with Debug-${NP_APP_FLAVOUR} or Release-${NP_APP_FLAVOUR} (configuration flavour: '${NP_FLAVOUR:-unset}')."
            exit 1
          fi
    settings:
      base:
        PRODUCT_NAME: NetworkPlatform
        PRODUCT_BUNDLE_IDENTIFIER: $(NP_BUNDLE_ID_PREFIX)
        # Info.plist carries only the keys Xcode cannot generate; the rest is generated and merged.
        INFOPLIST_FILE: SharedApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(NP_DISPLAY_NAME)
        # Empty by default (unsigned CI builds); the signed TestFlight build passes the App Store profile name.
        PROVISIONING_PROFILE_SPECIFIER: $(NP_APP_PROFILE_SPECIFIER)
        # iPhone and iPad from one target.
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"
        CODE_SIGN_ENTITLEMENTS: SharedApp/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SharedApp/App-macOS.entitlements
        # App icon generated by Tools/make-app-icon.py (Branding/iOS, Branding/macOS). tvOS and visionOS need
        # layered icon stacks, which are not generated yet; they keep the system placeholder.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]": AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": AppIcon
    dependencies:
      # Engine-neutral model (no engine code): Shared/ uses TunnelAddressing for the interface plan.
      - package: NetworkPlatform
        product: DomainModels
      # Import, profile file + Keychain, compilation for the start request (pure Swift, no engine adapters).
      - package: NetworkPlatform
        product: ConfigurationEngine
      - package: NetworkPlatform
        product: ProfileLibrary
      # Tokens, fonts (SIL OFL, package resources) and components of the UI; SwiftUI only, no engine code.
      - package: NetworkPlatform
        product: DesignSystem
      # Automatic connection and traffic-lock settings mapped onto the VPN configuration (Foundation only).
      - package: NetworkPlatform
        product: TunnelAutomation
      - sdk: NetworkExtension.framework

  PacketTunnel:
    type: app-extension
    platform: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: ../Extensions/PacketTunnel
        excludes:
          - "*.plist"
          - "*.entitlements"
    preBuildScripts:
      - name: Flavour guard
        basedOnDependencyAnalysis: false
        script: |
          case " ${NP_FLAVOUR_CONDITIONS:-} " in
            *" ${NP_ENGINE_CONDITIONS} "*) exit 0 ;;
          esac
          echo "error: ${TARGET_NAME} contains ${NP_ENGINE_CONDITIONS}, which the flavour '${NP_FLAVOUR:-unset}' does not (${NP_FLAVOUR_CONDITIONS:-none})."
          exit 1
    settings:
      base:
        INFOPLIST_FILE: ../Extensions/PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"
        CODE_SIGN_ENTITLEMENTS: ../Extensions/PacketTunnel/PacketTunnel-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ../Extensions/PacketTunnel/PacketTunnel-macOS.entitlements
    dependencies:
      - package: NetworkPlatform
        product: CoreAbstraction
      - package: NetworkPlatform
        product: DomainModels
      # Shared C ABI driver, packet pump, PacketTunnelFlowIO (pure Swift, no Go).
      - package: NetworkPlatform
        product: EngineBridge
      - sdk: NetworkExtension.framework

targets:
  PacketTunnelXray:
    templates: [PacketTunnel]
    settings:
      base:
        PRODUCT_NAME: PacketTunnelXray
        # Default $(NP_BUNDLE_ID_PREFIX).PacketTunnelXray (Configurations/Base.xcconfig); Byk.xcconfig overrides it.
        PRODUCT_BUNDLE_IDENTIFIER: $(NP_XRAY_EXTENSION_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(NP_XRAY_EXTENSION_PROFILE_SPECIFIER)
        NP_ENGINE_CONDITIONS: NP_ENGINE_XRAY
    dependencies:
      # Adapter of the Xray bridge (NetworkCore + packet pump of EngineBridge). Pure Swift; the npb_* calls
      # are made by Extensions/PacketTunnel/BridgeBinding.swift, so the package never links Go.
      - package: NetworkPlatform
        product: EngineXray
      # Static C archive of the Go bridge (Cores/BuildScripts/bridge-apple-xcframework.sh); not embedded.
      # Its module map links libresolv, CoreFoundation and Security, which the Go runtime needs.
      - framework: ../Cores/Bridge/build/apple/NPXrayBridge.xcframework
        embed: false

  PacketTunnelMihomo:
    templates: [PacketTunnel]
    settings:
      base:
        PRODUCT_NAME: PacketTunnelMihomo
        PRODUCT_BUNDLE_IDENTIFIER: $(NP_BUNDLE_ID_PREFIX).PacketTunnelMihomo
        NP_ENGINE_CONDITIONS: NP_ENGINE_MIHOMO
    dependencies:
      # Adapter of the Mihomo bridge; the npb_* calls are in Extensions/PacketTunnel/MihomoBridgeBinding.swift.
      - package: NetworkPlatform
        product: EngineMihomo
      # Static C archive of the Mihomo bridge (NP_BRIDGE_ENGINE=mihomo bridge-apple-xcframework.sh). GPL-3.0.
      - framework: ../Cores/MihomoBridge/build/apple/NPMihomoBridge.xcframework
        embed: false

  AppXrayOnly:
    templates: [App]
    settings:
      base:
        NP_APP_FLAVOUR: XrayOnly
    dependencies:
      - target: PacketTunnelXray_${platform}
        embed: true

  AppMihomoOnly:
    templates: [App]
    settings:
      base:
        NP_APP_FLAVOUR: MihomoOnly
    dependencies:
      - target: PacketTunnelMihomo_${platform}
        embed: true

  AppDual:
    templates: [App]
    settings:
      base:
        NP_APP_FLAVOUR: Dual
    dependencies:
      - target: PacketTunnelXray_${platform}
        embed: true
      - target: PacketTunnelMihomo_${platform}
        embed: true
