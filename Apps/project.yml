# XcodeGen specification: app + Packet Tunnel extension for iOS/iPadOS (one universal target), macOS,
# tvOS and visionOS, in the build flavours of ADR-0007 (XrayOnly, MihomoOnly, Dual).
#
#   Cores/BuildScripts/bridge-apple-xcframework.sh     # NPXrayBridge.xcframework, needs Go
#   cd Apps && xcodegen generate
#
# Verified state: the XrayOnly flavour of every target compiles and links on the macOS CI runner without
# signing (.github/workflows/apple.yml; links and results in STATUS.md). Nothing was signed, installed or
# run. MihomoOnly and Dual are declared but stop at the "Flavour guard" build phase (see below).
# The generated NetworkPlatform.xcodeproj is not stored in git.
#
# Before a signed build set, in Configurations/Local.xcconfig (git-ignored) or on the command line
# (Documentation/Apple/BUILD_ON_MAC.md):
#   NP_BUNDLE_ID_PREFIX  - a bundle identifier owned by the signing team (default: a placeholder)
#   DEVELOPMENT_TEAM     - the Apple Developer team identifier
# and register the App Group and the Network Extension capability for both identifiers.
#
# Targets (one per platform, XcodeGen suffixes the name with _<platform>):
#   App_<p>           application; embeds PacketTunnel_<p>; does not link Go (ADR-0001)
#   PacketTunnel_<p>  app extension (NEPacketTunnelProvider); links CoreAbstraction, EngineXray and NPXrayBridge
#
# Build configurations = flavour x {Debug, Release}; each flavour sets NP_FLAVOUR and Swift compilation
# conditions through Configurations/<flavour>.xcconfig (ADR-0004: flavours by xcconfig, no duplicated
# targets). MihomoOnly and Dual need the Mihomo bridge artifact and, for Dual, a second extension target;
# neither exists, so the extension's guard phase fails those builds with the reason instead of producing
# an app that pretends to contain Mihomo.
#
# App Group (NP_APP_GROUP): both targets of a platform name the same group, in the entitlements and in
# the Info.plist key NPAppGroupIdentifier. iOS, tvOS, visionOS use group.<id>; macOS uses <TeamID>.<id>
# ($(TeamIdentifierPrefix) expands to "<TeamID>." only when signed with a team). [U] for a signed build.
#
# Not covered: the Developer ID system-extension variant of macOS (ADR-0005 §3).

name: NetworkPlatform

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"

configs:
  Debug-XrayOnly: debug
  Release-XrayOnly: release
  Debug-MihomoOnly: debug
  Release-MihomoOnly: release
  Debug-Dual: debug
  Release-Dual: release

configFiles:
  Debug-XrayOnly: Configurations/XrayOnly.xcconfig
  Release-XrayOnly: Configurations/XrayOnly.xcconfig
  Debug-MihomoOnly: Configurations/MihomoOnly.xcconfig
  Release-MihomoOnly: Configurations/MihomoOnly.xcconfig
  Debug-Dual: Configurations/Dual.xcconfig
  Release-Dual: Configurations/Dual.xcconfig

packages:
  NetworkPlatform:
    path: ..

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Reports data-race problems as warnings in Swift 5 mode.
    SWIFT_STRICT_CONCURRENCY: complete
    # Flavour conditions come from the xcconfig; DEBUG is kept for debug configurations.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(NP_FLAVOUR_CONDITIONS)"
    NP_APP_GROUP: group.$(NP_BUNDLE_ID_PREFIX)
    "NP_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)$(NP_BUNDLE_ID_PREFIX)
    "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(NP_FLAVOUR_CONDITIONS)"

schemes:
  NetworkPlatform-iOS:
    build:
      targets:
        App_iOS: all
    run:
      config: Debug-XrayOnly
    archive:
      config: Release-XrayOnly
  NetworkPlatform-macOS:
    build:
      targets:
        App_macOS: all
    run:
      config: Debug-XrayOnly
    archive:
      config: Release-XrayOnly
  NetworkPlatform-tvOS:
    build:
      targets:
        App_tvOS: all
    run:
      config: Debug-XrayOnly
    archive:
      config: Release-XrayOnly
  NetworkPlatform-visionOS:
    build:
      targets:
        App_visionOS: all
    run:
      config: Debug-XrayOnly
    archive:
      config: Release-XrayOnly

targets:
  App:
    type: application
    platform: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: SharedApp
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: ../Extensions/PacketTunnel/Shared
    settings:
      base:
        PRODUCT_NAME: NetworkPlatform
        PRODUCT_BUNDLE_IDENTIFIER: $(NP_BUNDLE_ID_PREFIX)
        # Info.plist carries only the keys Xcode cannot generate; the rest is generated and merged.
        INFOPLIST_FILE: SharedApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: NetworkPlatform
        # iPhone and iPad from one target.
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"
        CODE_SIGN_ENTITLEMENTS: SharedApp/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SharedApp/App-macOS.entitlements
    dependencies:
      - target: PacketTunnel_${platform}
        embed: true
      # Engine-neutral model (no engine code): Shared/ uses TunnelAddressing for the interface plan.
      - package: NetworkPlatform
        product: DomainModels
      - sdk: NetworkExtension.framework

  PacketTunnel:
    type: app-extension
    platform: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: ../Extensions/PacketTunnel
        excludes:
          - "*.plist"
          - "*.entitlements"
    preBuildScripts:
      - name: Flavour guard
        basedOnDependencyAnalysis: false
        script: |
          case "${NP_FLAVOUR:-}" in
            XrayOnly) exit 0 ;;
            MihomoOnly|Dual)
              echo "error: flavour ${NP_FLAVOUR} is declared but not buildable yet: the Mihomo engine artifact (NPMihomoBridge.xcframework) and the Mihomo Packet Tunnel extension target do not exist (ADR-0007, STATUS.md)."
              exit 1 ;;
            *)
              echo "error: NP_FLAVOUR is not set; build with one of the flavour configurations (Debug-XrayOnly, ...)."
              exit 1 ;;
          esac
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(NP_BUNDLE_ID_PREFIX).PacketTunnel
        INFOPLIST_FILE: ../Extensions/PacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"
        CODE_SIGN_ENTITLEMENTS: ../Extensions/PacketTunnel/PacketTunnel-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ../Extensions/PacketTunnel/PacketTunnel-macOS.entitlements
    dependencies:
      - package: NetworkPlatform
        product: CoreAbstraction
      - package: NetworkPlatform
        product: DomainModels
      # Adapter of the Xray bridge (NetworkCore + packet pump). Pure Swift; the npb_* calls are made by
      # Extensions/PacketTunnel/XrayBridgeBinding.swift, so the package never links Go.
      - package: NetworkPlatform
        product: EngineXray
      # Static C archive of the Go bridge (Cores/BuildScripts/bridge-apple-xcframework.sh); not embedded.
      # Its module map links libresolv, CoreFoundation and Security, which the Go runtime needs.
      - framework: ../Cores/Bridge/build/apple/NPXrayBridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
