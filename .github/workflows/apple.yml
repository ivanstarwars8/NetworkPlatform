# (c) The Go bridges built for Apple platforms (c-archive slices -> NPXrayBridge.xcframework and
#     NPMihomoBridge.xcframework, the same ten slices), verified (recorded platforms of every object, no
#     proc_pidinfo/recvmsg_x/sendmsg_x symbols) and their C ABI smoke tests run natively on the macOS arm64 runner.
# (d) xcodebuild of the app + Packet Tunnel extensions per platform and flavour (XrayOnly, MihomoOnly, Dual),
#     without signing (CODE_SIGNING_ALLOWED=NO), with product checks: embedded extensions per flavour, each
#     extension links only its own engine, the app links none (Tools/apple-build-flavour.sh).
# An unsigned compile proves compilation and linking only: nothing here installs or runs a tunnel.
# No secrets, no signing material, no releases.
name: Apple

on:
  push:
    branches: [main]
    paths: &paths
      - Apps/**
      - Extensions/**
      - Packages/**
      - Package.swift
      - Cores/Bridge/**
      - Cores/MihomoBridge/**
      - Cores/BuildScripts/bridge-apple-*.sh
      - Cores/BuildScripts/mihomo-apple-patch.sh
      - Tools/apple-build-flavour.sh
      - .github/workflows/apple.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip

jobs:
  bridge:
    name: ${{ matrix.engine }} bridge xcframework (macOS runner)
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: xray, dir: Cores/Bridge, framework: NPXrayBridge, lib: libnpbridge }
          - { engine: mihomo, dir: Cores/MihomoBridge, framework: NPMihomoBridge, lib: libnpmihomo }
    env:
      NP_BRIDGE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache key of the bridge sources
        id: key
        run: |
          echo "hash=${{ hashFiles(format('{0}/**', matrix.dir), 'Cores/BuildScripts/bridge-apple-xcframework.sh', 'Cores/BuildScripts/mihomo-apple-patch.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore xcframework
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build/apple
          key: np${{ matrix.engine }}bridge-${{ steps.key.outputs.hash }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Build slices and xcframework
        if: steps.cache.outputs.cache-hit != 'true'
        run: Cores/BuildScripts/bridge-apple-xcframework.sh
      - name: Slice report
        run: |
          d=${{ matrix.dir }}/build/apple
          cat "$d/versions.txt"
          { echo "### ${{ matrix.framework }} slices"; echo '```'; column -t -s $'\t' "$d/build.tsv"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          column -t -s $'\t' "$d/build.tsv"
      - name: Verify recorded platforms and private symbols (otool, nm)
        run: |
          Cores/BuildScripts/bridge-apple-verify.sh
          { echo "### ${{ matrix.framework }} verification"; echo '```'; column -t -s $'\t' ${{ matrix.dir }}/build/apple/verify.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: C ABI smoke test on macOS arm64 (runs the bridge natively)
        run: |
          d=${{ matrix.dir }}/build/apple/slices/macos-arm64
          clang -O2 -Wall -I"$d" -o "$RUNNER_TEMP/abi_test" ${{ matrix.dir }}/cabi/ctest/abi_test.c "$d/${{ matrix.lib }}.a" \
            -lresolv -framework CoreFoundation -framework Security
          "$RUNNER_TEMP/abi_test" | tee "$RUNNER_TEMP/abi_test.log"
          { echo "### ${{ matrix.engine }} C ABI test (macOS arm64)"; echo '```'; tail -n 15 "$RUNNER_TEMP/abi_test.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}
          path: |
            ${{ matrix.dir }}/build/apple/${{ matrix.framework }}.xcframework
            ${{ matrix.dir }}/build/apple/build.tsv
            ${{ matrix.dir }}/build/apple/verify.tsv
            ${{ matrix.dir }}/build/apple/versions.txt
          retention-days: 3
          compression-level: 6

  app:
    name: xcodebuild ${{ matrix.platform }} ${{ matrix.kind }} (3 flavours, unsigned)
    needs: bridge
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: iOS, kind: Debug }
          - { platform: iOS, kind: Release }
          - { platform: iOS-Simulator, kind: Debug }
          - { platform: macOS, kind: Debug }
          - { platform: tvOS, kind: Debug }
          - { platform: visionOS, kind: Debug }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NPXrayBridge
          path: Cores/Bridge/build/apple
      - uses: actions/download-artifact@v4
        with:
          name: NPMihomoBridge
          path: Cores/MihomoBridge/build/apple
      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          cd Apps && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          xcodebuild -list -project NetworkPlatform.xcodeproj
      - name: Toolchain
        run: xcodebuild -version
      # One job per platform builds the three flavours into the same derived data, so the package modules are
      # compiled once. Every flavour is attempted; the job fails if any flavour failed.
      - name: Build XrayOnly, MihomoOnly, Dual (CODE_SIGNING_ALLOWED=NO) and check the products
        run: |
          echo "### ${{ matrix.platform }} ${{ matrix.kind }}" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for flavour in XrayOnly MihomoOnly Dual; do
            echo "::group::$flavour"
            Tools/apple-build-flavour.sh "${{ matrix.platform }}" "$flavour" "${{ matrix.kind }}" "$RUNNER_TEMP/dd" || status=1
            echo "::endgroup::"
          done
          grep -h '^RESULT' "$RUNNER_TEMP"/dd/*.log 2>/dev/null || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-logs-${{ matrix.platform }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/dd/*.log
          retention-days: 7
