# (b) The Go bridge (Cores/Bridge) on Linux: gofmt, vet, unit and integration tests, race detector, and the
# C ABI smoke test against the c-archive. Linux only: Apple slices are built by apple.yml.
name: Bridge (Go, Linux)

on:
  push:
    branches: [main]
    paths: &paths
      - Cores/Bridge/**
      - Cores/BuildScripts/bridge-linux-cabi-test.sh
      - .github/workflows/bridge-go.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Cores/Bridge

jobs:
  linux:
    name: vet + test + race (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Cores/Bridge/go.mod
          cache-dependency-path: Cores/Bridge/go.sum
      - name: Toolchain
        run: go version && go list -m github.com/xtls/xray-core
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 -timeout 20m ./...
      - name: Stock xray from the pinned core (server side of the integration tests)
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/xray" github.com/xtls/xray-core/main && "$RUNNER_TEMP/xray" version | head -1
      # Under -race the pinned Xray-core reports a data race of its own inside Vision (proxy/proxy.go 255/384,
      # proxy/vless). Every test that sends traffic through VLESS+REALITY+Vision can hit it: on CI both
      # TestFlowThroughProxyWithDNS and TestProtocolsOverLoopback/VLESS+REALITY+Vision did. Those two cases run
      # in the KNOWN FAILURE step below; everything else must be race-free.
      # TestObserveAndSelect reads the core's observatory, which the pinned core publishes without its lock
      # (app/observatory Observer.GetObservation returns the live status slice; the core's own leastPing
      # strategy reads it the same way on every new connection). It runs in its own KNOWN FAILURE step below.
      - name: race (all tests except the two Vision cases and the observatory read)
        env:
          NP_STOCK_XRAY: ${{ runner.temp }}/xray
        run: |
          go test -race -count=1 -timeout 30m -skip '^(TestFlowThroughProxyWithDNS|TestProtocolsOverLoopback|TestObserveAndSelect)$' ./...
          go test -race -count=1 -timeout 15m -run '^TestProtocolsOverLoopback$' -skip '^TestProtocolsOverLoopback$/^VLESS\+REALITY\+Vision$' ./engine
      - name: race, flow + DNS over Trojan+TLS (bridge packet path without Vision)
        env:
          NP_STOCK_XRAY: ${{ runner.temp }}/xray
          NP_TEST_FLOW_PROXY: Trojan+TLS
        run: go test -race -count=1 -timeout 10m -run '^TestFlowThroughProxyWithDNS$' ./engine
      # Known failure, reported, not hidden. Passes only while each Vision case either passes or fails with a
      # data race whose conflicting accesses are inside Xray-core (proxy/proxy.go); any other failure fails.
      - name: KNOWN FAILURE check, race, Vision cases (Xray-core data race)
        env:
          NP_STOCK_XRAY: ${{ runner.temp }}/xray
        run: |
          # True when a bridge frame is in an access stack (Read/Write/Previous ... at) of a race report. The
          # bridge may appear in "Goroutine N created at" (it dispatches the connection to the core); the
          # conflicting accesses themselves must be in the core for the failure to count as the known one.
          bridge_access() {
            sed 's/^.*Z //' "$1" | awk '
              /^(Read|Write|Previous read|Previous write|Atomic)/ { acc = 1; next }
              /^$/ || /^Goroutine/ { acc = 0 }
              acc && /networkplatform\/bridge/ { found = 1 }
              END { exit !found }'
          }
          status=0
          for run in '^TestFlowThroughProxyWithDNS$' '^TestProtocolsOverLoopback$/^VLESS\+REALITY\+Vision$'; do
            log="$RUNNER_TEMP/vision-race.log"
            set +e
            go test -race -count=1 -timeout 10m -v -run "$run" ./engine >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$run passes under -race (Vision race not reproduced this time)"
              continue
            fi
            races=$(grep -c 'WARNING: DATA RACE' "$log" || true)
            if [ "$races" -gt 0 ] && grep -q 'xtls/xray-core.*/proxy/proxy.go' "$log" && ! bridge_access "$log"; then
              echo "::warning::KNOWN FAILURE: $run fails under -race with $races Xray-core data race report(s) in Vision (proxy/proxy.go); no bridge frame in the conflicting accesses. See STATUS.md."
              grep -A6 'WARNING: DATA RACE' "$log" | head -24
            else
              echo "$run failed for a reason other than the known Vision race:"
              tail -n 80 "$log"
              status=1
            fi
          done
          exit "$status"
      # Known failure, reported, not hidden. Passes only while the test either passes or fails with data races
      # whose writing side is the core's observatory (app/observatory updateStatusForResult): the core keeps
      # its status list behind a lock it does not take in GetObservation. Any other race or failure fails.
      - name: KNOWN FAILURE check, race, observatory read (Xray-core publishes without its lock)
        run: |
          log="$RUNNER_TEMP/observe-race.log"
          set +e
          go test -race -count=1 -timeout 5m -v -run '^TestObserveAndSelect$' ./engine >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice::TestObserveAndSelect passes under -race (observatory race not reproduced this time)"
            exit 0
          fi
          races=$(grep -c 'WARNING: DATA RACE' "$log" || true)
          # Every report must name the core's observatory writer; the test must not fail otherwise.
          writers=$(awk '
            /^WARNING: DATA RACE/ { if (n) print w; n = 1; w = 0; next }
            /xtls\/xray-core.*app\/observatory\.\(\*Observer\)\.updateStatusForResult/ { w = 1 }
            END { if (n) print w }' "$log" | grep -c '^1$' || true)
          if [ "$races" -gt 0 ] && [ "$races" -eq "$writers" ] && ! grep -E -- '--- FAIL|observe_test.go:[0-9]+:' "$log" | grep -v 'race detected' | grep -q 'observe_test.go'; then
            echo "::warning::KNOWN FAILURE: TestObserveAndSelect fails under -race with $races report(s) against the core's observatory writer (GetObservation takes no lock). See STATUS.md."
            grep -A6 'WARNING: DATA RACE' "$log" | head -24
          else
            echo "TestObserveAndSelect failed for a reason other than the known observatory race:"
            tail -n 80 "$log"
            exit 1
          fi
      - name: C ABI smoke test against the c-archive (linux/amd64)
        working-directory: .
        run: Cores/BuildScripts/bridge-linux-cabi-test.sh
