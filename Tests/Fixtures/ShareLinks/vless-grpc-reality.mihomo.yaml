mode: rule
log-level: warning
ipv6: true
allow-lan: false
find-process-mode: "off"
profile:
  store-selected: false
  store-fake-ip: false
unified-delay: true
tcp-concurrent: false
geo-auto-update: false
tun:
  enable: true
  stack: mips
  mtu: 1500
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  inet6-address:
    - "fd66:6e70::1/126"
  auto-route: false
  auto-detect-interface: false
dns:
  enable: true
  ipv6: true
  use-system-hosts: false
  enhanced-mode: redir-host
  fake-ip-range: "198.18.0.1/30"
  default-nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
  nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
proxies:
  - name: proxy-0000
    type: vless
    server: "192.0.2.11"
    port: 8443
    uuid: "7cbd604a-1e57-419f-8fe1-e39a88ade162"
    packet-encoding: xudp
    udp: true
    tls: true
    servername: www.example.net
    client-fingerprint: safari
    reality-opts:
      public-key: Z__smirXnH5v85ySxE24UXnJYAS4ElyAynyt59rqQw4
      support-x25519mlkem768: true
    network: grpc
    grpc-opts:
      grpc-service-name: grpc.Service
rules:
  - "IP-CIDR,192.0.2.11/32,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,255.255.255.255/32,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"
  - "IP-CIDR6,ff00::/8,DIRECT,no-resolve"
  - "MATCH,proxy-0000"
