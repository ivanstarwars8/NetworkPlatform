mode: rule
log-level: warning
ipv6: true
allow-lan: false
find-process-mode: "off"
profile:
  store-selected: false
  store-fake-ip: false
unified-delay: true
tcp-concurrent: false
geo-auto-update: false
tun:
  enable: true
  stack: mips
  mtu: 1500
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  inet6-address:
    - "fd66:6e70::1/126"
  auto-route: false
  auto-detect-interface: false
dns:
  enable: true
  ipv6: true
  use-system-hosts: false
  enhanced-mode: redir-host
  fake-ip-range: "198.18.0.1/30"
  default-nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
  nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
proxies:
  - name: proxy-0000
    type: wireguard
    server: "192.0.2.70"
    port: 51820
    private-key: KFzVBHhjWlHJ138ha7PHbojjKyuBi9fEo0TkDOTbFEk=
    public-key: SrzNM+g/tbifF/Pwo2ZNGzwSriAcdo7RbBrsn+Rz7Qo=
    ip: "10.7.0.2/32"
    ipv6: "fd00:7::2/128"
    allowed-ips:
      - "0.0.0.0/0"
      - "::/0"
    mtu: 1280
    udp: true
rules:
  - "IP-CIDR,192.0.2.70/32,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,255.255.255.255/32,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"
  - "IP-CIDR6,ff00::/8,DIRECT,no-resolve"
  - "MATCH,proxy-0000"
