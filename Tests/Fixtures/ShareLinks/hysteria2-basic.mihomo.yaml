mode: rule
log-level: warning
ipv6: true
allow-lan: false
find-process-mode: "off"
profile:
  store-selected: false
  store-fake-ip: false
unified-delay: true
tcp-concurrent: false
geo-auto-update: false
tun:
  enable: true
  stack: mips
  mtu: 1500
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  inet6-address:
    - "fd66:6e70::1/126"
  auto-route: false
  auto-detect-interface: false
dns:
  enable: true
  ipv6: true
  use-system-hosts: false
  enhanced-mode: redir-host
  fake-ip-range: "198.18.0.1/30"
  default-nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
  nameserver:
    - "1.1.1.1#proxy-0000"
    - "8.8.8.8#proxy-0000"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
proxies:
  - name: proxy-0000
    type: hysteria2
    server: hy.example.com
    port: 443
    password: udihPqDumwBiY6PSt26Nqr9G
    sni: hy.example.com
    initial-stream-receive-window: 524288
    max-stream-receive-window: 2097152
    initial-connection-receive-window: 1048576
    max-connection-receive-window: 4194304
rules:
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,224.0.0.0/4,DIRECT,no-resolve"
  - "IP-CIDR,255.255.255.255/32,DIRECT,no-resolve"
  - "IP-CIDR6,fe80::/10,DIRECT,no-resolve"
  - "IP-CIDR6,ff00::/8,DIRECT,no-resolve"
  - "MATCH,proxy-0000"
